<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --indigo: #4f46e5;
        --indigo-dark: #4338ca;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --ok: #059669;
        --err: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1f2937;
          --fg: #f9fafb;
          --muted: #9ca3af;
          --border: #374151;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 300px;
        margin: 0;
        padding: 16px;
        font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 15px; margin: 0 0 12px; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        font-size: 14px;
      }
      input#code { letter-spacing: 4px; text-align: center; font-size: 18px; }
      button {
        width: 100%;
        padding: 9px 12px;
        border: 0;
        border-radius: 8px;
        background: var(--indigo);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 10px;
      }
      button:hover { background: var(--indigo-dark); }
      button:disabled { opacity: 0.6; cursor: default; }
      button.secondary { background: transparent; color: var(--indigo); border: 1px solid var(--border); }
      button.link { background: none; color: var(--muted); border: 0; padding: 4px; font-weight: 400; font-size: 12px; text-decoration: underline; width: auto; }
      .row { display: flex; gap: 8px; }
      .row button { margin-top: 0; }
      .status { margin-top: 10px; font-size: 12px; min-height: 16px; }
      .status.ok { color: var(--ok); }
      .status.err { color: var(--err); }
      .who { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
      .who strong { color: var(--fg); }
      .sent-to { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
      .hint { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
      .hint kbd {
        font: inherit; background: var(--border); border-radius: 4px;
        padding: 1px 5px; font-size: 11px;
      }
      a { color: var(--indigo); }
      hr { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }
      .hidden { display: none; }
      .update-banner {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -4px 0 14px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(245, 158, 11, 0.14);
        border: 1px solid rgba(245, 158, 11, 0.45);
        font-size: 12px;
      }
      .update-banner span { flex: 1; }
      .update-banner button {
        width: auto;
        margin: 0;
        padding: 5px 9px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        background: #f59e0b;
        color: #1a1205;
      }
      .update-banner button:hover { background: #e08c07; }
    </style>
  </head>
  <body>
    <div id="update-banner" class="update-banner hidden">
      <span id="update-text"></span>
      <button id="update-how" type="button">How to update</button>
    </div>

    <h1>HR Tool Attendance</h1>

    <!-- Step 1: request a code -->
    <div id="step-email">
      <label for="email">Your work email</label>
      <input id="email" type="email" placeholder="you@company.com" autocomplete="email" />
      <button id="sendCode">Send verification code</button>
    </div>

    <!-- Step 2: enter the code -->
    <div id="step-code" class="hidden">
      <p class="sent-to">We emailed a 6-digit code to <strong id="code-email"></strong>.</p>
      <label for="code">Verification code</label>
      <input id="code" type="text" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code" />
      <button id="verify">Verify &amp; connect</button>
      <button id="backToEmail" class="link">Use a different email</button>
    </div>

    <!-- Connected -->
    <div id="connected" class="hidden">
      <div class="who">Signed in as <strong id="who-name"></strong></div>
      <div class="row">
        <button id="clockIn">Clock in</button>
        <button id="clockOut" class="secondary">Clock out</button>
      </div>
      <hr />
      <button id="disconnect" class="secondary">Disconnect</button>
    </div>

    <div id="status" class="status" role="status"></div>

    <div class="hint">
      Shortcuts: <kbd id="kb-in">Alt+Shift+I</kbd> clock in ·
      <kbd id="kb-out">Alt+Shift+O</kbd> clock out.<br />
      Change them at <a href="#" id="shortcuts-link">chrome://extensions/shortcuts</a>.
    </div>

    <script src="popup.js"></script>
  </body>
</html>
